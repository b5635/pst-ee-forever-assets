# Push a tag like v1.0.0 -> zip pst_forever/ and publish it as a GitHub release.
# The zip has a fixed name, so this link always points at the newest one:
#   https://github.com/<owner>/<repo>/releases/latest/download/pst_forever-assets.zip
# Run it by hand from the Actions tab (workflow_dispatch) to get the zip as a build artifact only.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Layout = the game folder: players unzip it next to Torment.exe.
      - name: Package
        run: zip -r -q pst_forever-assets.zip pst_forever

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: pst_forever-assets
          path: pst_forever-assets.zip
          compression-level: 0

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" pst_forever-assets.zip
          --verify-tag --title "$GITHUB_REF_NAME"
          --notes "Unzip pst_forever-assets.zip into the game folder, next to Torment.exe, then switch lighting on in pst_forever_config.exe. Needs PST Forever installed."
